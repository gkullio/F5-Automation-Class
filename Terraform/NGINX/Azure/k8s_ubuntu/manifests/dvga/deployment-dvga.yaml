apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvga
  namespace: dvga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvga
  template:
    metadata:
      labels:
        app: dvga
    spec:
      containers:
      - name: dvga
        image: dolevf/dvga:latest
        ports:
        - containerPort: 5013
        env:
        - name: WEB_HOST
          value: "0.0.0.0"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"