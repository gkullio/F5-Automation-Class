apiVersion: v1
kind: Namespace
metadata:
  name: dvga
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvga
  namespace: dvga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvga
  template:
    metadata:
      labels:
        app: dvga
    spec:
      containers:
        - name: dvga
          image: dolevf/dvga:latest
          ports:
            - containerPort: 5013
          env:
            - name: WEB_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dvga
  namespace: dvga
spec:
  type: ClusterIP
  selector:
    app: dvga
  ports:
    - name: http
      port: 80
      targetPort: 5013
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dvga
  namespace: dvga
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: dvga.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dvga
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dvga
  namespace: dvga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dvga
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
