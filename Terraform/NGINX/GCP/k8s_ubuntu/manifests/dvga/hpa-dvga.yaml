apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dvga
  namespace: dvga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dvga
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50