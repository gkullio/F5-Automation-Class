# Reverse proxy for the stockdemo/demoapp Docker container
# Accepts traffic on port 80 via the VM's public management IP
server {
    listen 80;

    # IP-only access — no hostname required; matches any request reaching this port
    server_name _;

    location / {
        # Route to the demoapp container bound to localhost:8080
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
